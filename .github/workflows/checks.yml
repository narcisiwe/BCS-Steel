name: Static site checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source, generated locales, links and media hashes
        run: python3 -m unittest discover -s tests -v
      - name: Verify generated pages are committed
        run: git diff --exit-code -- index.html ru/index.html en/index.html sitemap.xml
# Browser checks use an already installed Playwright/Chromium in the cloud
# workspace. No package installation and no deployment occur in this workflow.
